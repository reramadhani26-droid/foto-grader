<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foto Grader</title>
<style>
:root{--bg:#121214;--panel:#1c1c20;--line:#2c2c33;--txt:#e8e8ee;--mut:#8a8a96;--acc:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 380px;height:100dvh}
@media (max-width:820px),(orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:46% 54%}}
#stage{display:flex;flex-direction:column;min-height:0;min-width:0}
#bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border-bottom:1px solid var(--line)}
button,.btn,select{background:#2a2a32;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}
button.pri,.btn.pri{background:var(--acc);color:#001;border-color:var(--acc);font-weight:600}
button.sm{padding:5px 9px;font-size:12px}
#cmp{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#file{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
#info{font-size:12px;color:var(--mut);width:100%}
#view{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;position:relative;overflow:hidden}
